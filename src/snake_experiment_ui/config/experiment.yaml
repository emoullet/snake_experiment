schema_version: 1

block_sequence:
  - id: mode_1_discovery
    mode_role: mode_1
    phase: discovery
  - id: mode_2_discovery
    mode_role: mode_2
    phase: discovery
  - id: mode_1_training
    mode_role: mode_1
    phase: training
  - id: mode_1_recording
    mode_role: mode_1
    phase: recording
  - id: mode_2_training
    mode_role: mode_2
    phase: training
  - id: mode_2_recording
    mode_role: mode_2
    phase: recording

phases:
  discovery:
    rosbag_topics: [/joy, /ee_pose, /joint_states, /mode_request, /joystick_cartesian_command, /cartesian_command, /ee_velocity]
    instructions:
      placeholder: true
      text: "TODO — Replace this placeholder with the approved standardized discovery instructions before running participant sessions."
  training:
    cycles: 2
    target_sequence: [1, 2, 3, 1]
    rosbag_topics: [/joy, /ee_pose, /joint_states, /mode_request, /joystick_cartesian_command, /cartesian_command, /ee_velocity]
    trial_folder_pattern: "{mode}_training_trial_{trial_id:03d}_{cycle:02d}_{target_start}_{target_end}"
    attempt_pattern: "attempt_{attempt:03d}"
  recording:
    cycles: 10
    target_sequence: [1, 2, 3, 1]
    rosbag_topics: [/joy, /ee_pose, /joint_states, /mode_request, /joystick_cartesian_command, /cartesian_command, /ee_velocity]
    trial_folder_pattern: "{mode}_trial_{trial_id:03d}_{cycle:02d}_{target_start}_{target_end}"
    attempt_pattern: "attempt_{attempt:03d}"

success_thresholds:
  provisional: true # Marks these success criteria as provisional pending validation.
  linear_mm: 1.0 # Maximum end-effector position error for a target to count as reached.
  angular_deg: 1.0 # Maximum end-effector orientation error for a target to count as reached.
  start_linear_mm: 1.0 # Maximum position error allowed when starting a trial.
  start_angular_deg: 1.0 # Maximum orientation error allowed when starting a trial.
  success_dwell_sec: 0.5 # Time the target pose must remain within tolerance to register success.
  pose_freshness_sec: 0.5 # Maximum age of pose feedback accepted for success evaluation.

go_to_thresholds:
  linear_mm: 5.0 # Maximum distance error from the target for arrival.
  angular_deg: 5.0 # Maximum orientation error from the target for arrival.
  dwell_sec: 0.5 # Continuous time both errors must stay within tolerance to succeed.
  linear_progress_mm_per_sec: 0.5 # Minimum decrease in distance error per second to count as progress.
  angular_progress_deg_per_sec: 0.5 # Minimum decrease in orientation error per second to count as progress.

rosbag:
  storage: mcap
  segment_pattern: "rosbag_{index:03d}"
