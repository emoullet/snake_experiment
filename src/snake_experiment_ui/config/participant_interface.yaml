schema_version: 1

# Shared viewpoint for both joystick previews: view_1 through view_6.
# The participant may change it until the page is reloaded.
preview:
  default_view: view_1

# Absolute or YAML-relative paths to MP4 files. Leave a slot empty until its
# approved video is available; the participant page then shows a placeholder.
videos:
  experiment_presentation: "/home/emoullet/Vidéos/Captures vidéo/expe_placeholder.mp4"
  mode_explanation:
    baseline: "/home/emoullet/Vidéos/Captures vidéo/baseline_placeholder.mp4"
    snake: "/home/emoullet/Vidéos/Captures vidéo/snake_placeholder.mp4"

# Absolute or YAML-relative PNG paths. Blank values display a placeholder.
state_images:
  baseline:
    b1: ""
    b2: ""
    b3: ""
  snake:
    b1: ""
    b2: ""
